name: Daily Five9 Scraper

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 7:00 PM Mountain Daylight Time (01:00 UTC)
  workflow_dispatch:      # Allows manual triggers via GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # Automatically cancels job if stuck longer than 15 minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-api-python-client google-auth-httplib2 google-auth-oauthlib
          playwright install --with-deps chromium

      - name: Reconstruct Google Auth Files
        env:
          TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          echo "$TOKEN_PICKLE_B64" | base64 --decode > token.pickle
          echo "$CLIENT_SECRET_JSON" > client_secret.json

      - name: Run Playwright Scraper
        env:
          FIVE9_USER: ${{ secrets.FIVE9_USER }}
          FIVE9_PASS: ${{ secrets.FIVE9_PASS }}
          HEADLESS_MODE: "true"
        run: python sales.py

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            state.json
          retention-days: 3
